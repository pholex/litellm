name: Build tokenweave image (linux/amd64)

# Internal deployment image build. Not part of upstream BerriAI/litellm CI.
# Builds the standard Dockerfile for linux/amd64 only (target: AWS ECS) and
# pushes to this fork's GHCR namespace.

on:
  push:
    branches:
      - "tokenweave/**"
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: "Extra tag suffix to append (optional)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_SLUG=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch_slug=${BRANCH_SLUG}" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/litellm:${{ steps.meta.outputs.branch_slug }}
            ghcr.io/${{ github.repository_owner }}/litellm:${{ steps.meta.outputs.branch_slug }}-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
